# The web container's nginx on Docker Compose, Podman and Kubernetes, run as the host user (wekan/wekan-serve.sh): it
# passes the project's address to Wekan's own service, websockets included (Wekan's screens follow a board over one).
# Written by the Wekan builder of the workspace; build again rather than editing.
worker_processes 1;
pid /tmp/wekan-nginx/nginx.pid;
error_log stderr warn;
events {
    worker_connections 1024;
}
http {
    access_log off;
    client_body_temp_path /tmp/wekan-nginx/body;
    proxy_temp_path /tmp/wekan-nginx/proxy;
    fastcgi_temp_path /tmp/wekan-nginx/fastcgi;
    uwsgi_temp_path /tmp/wekan-nginx/uwsgi;
    scgi_temp_path /tmp/wekan-nginx/scgi;
    # Attachments and avatars go up through here.
    client_max_body_size 100m;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8080;
        location / {
            # Wekan's address and the DNS server that looks it up while nginx runs (written by wekan-serve.sh at the
            # start, from the container's own): a container of Wekan started again may have another address.
            include /tmp/wekan-nginx/wekan.conf;
            proxy_pass $wekan;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
